<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackmoor Decomp Progress</title>
<style>
:root{
  color-scheme:light;
  --surface:#fcfcfb;--panel:#f3f2ee;--border:#d6d4cc;
  --text:#0b0b0b;--text-2:#52514e;--text-3:#7a7872;
  --code:#008300;--data:#2a78d6;--todo:#cfcdc5;--todo-edge:#b9b7ae;
  --focus:#c25b00;--tile-text:#2f2e2b;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark;
  --surface:#1a1a19;--panel:#242422;--border:#3a3a37;
  --text:#ffffff;--text-2:#c3c2b7;--text-3:#8f8e86;
  --code:#1e9d1e;--data:#3987e5;--todo:#3b3b38;--todo-edge:#4d4d49;
  --focus:#f0a040;--tile-text:#d9d8d0;}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19;--panel:#242422;--border:#3a3a37;
  --text:#ffffff;--text-2:#c3c2b7;--text-3:#8f8e86;
  --code:#1e9d1e;--data:#3987e5;--todo:#3b3b38;--todo-edge:#4d4d49;
  --focus:#f0a040;--tile-text:#d9d8d0;}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
.sub{color:var(--text-2);font-size:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 10px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--text-2);font-weight:600}
button:focus-visible,input:focus-visible,svg [tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:10px}
.bar-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.bar-card h2{margin:0 0 2px;font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.pct{font-size:28px;font-weight:650;letter-spacing:-.02em}
.track{height:12px;border-radius:6px;background:var(--todo);overflow:hidden;margin:8px 0 6px;position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;min-width:3px;border-radius:6px}
.fill.code{background:var(--code)}
.fill.data{background:repeating-linear-gradient(45deg,var(--data) 0 4px,color-mix(in srgb,var(--data) 55%,var(--surface)) 4px 8px)}
.fill.both{background:linear-gradient(90deg,var(--code),var(--data))}
.fill.zero{display:none}
.bar-card .n{font-size:12px;color:var(--text-2)}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--text-2);font-size:12px;margin-bottom:14px}
.facts b{color:var(--text)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.controls input[type=search]{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 9px;width:200px}
.crumbs{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--text-2);flex:1;min-width:160px}
.crumbs button{padding:2px 8px;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--text-2);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid var(--todo-edge)}
.legend .l-code{background:var(--code);border-color:var(--code)}
.legend .l-data{background:repeating-linear-gradient(45deg,var(--data) 0 3px,color-mix(in srgb,var(--data) 55%,var(--surface)) 3px 6px);border-color:var(--data)}
.legend .l-todo{background:var(--todo)}
.legend .l-hit{background:transparent;border:2px solid var(--code)}
#stage{position:relative;border:1px solid var(--border);border-radius:8px;background:var(--panel);overflow:hidden}
#stage svg{display:block;width:100%}
svg text{font:10.5px system-ui,sans-serif;fill:var(--tile-text);pointer-events:none}
svg .gl{font-weight:650;fill:var(--text-2);font-size:11px}
.tile{cursor:pointer}
.tile:hover rect.base{stroke:var(--text);stroke-width:1.5}
#tip{position:fixed;z-index:5;pointer-events:none;background:var(--surface);color:var(--text);
  border:1px solid var(--text-3);border-radius:6px;padding:7px 10px;font-size:12px;max-width:280px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);display:none}
#tip b{display:block;margin-bottom:2px}
#tip .row{display:flex;justify-content:space-between;gap:14px;color:var(--text-2)}
#tip .row span:last-child{color:var(--text);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--text-2);font-weight:600;position:sticky;top:0;background:var(--panel)}
#tableView{display:none;max-height:70vh;overflow:auto}
.notes{margin-top:18px;color:var(--text-2);font-size:12px;max-width:90ch}
.notes h3{margin:12px 0 4px;font-size:12px;color:var(--text);text-transform:uppercase;letter-spacing:.06em}
.notes p{margin:0 0 8px}
@media(max-width:760px){.bars{grid-template-columns:1fr}.controls input[type=search]{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Blackmoor decomp progress</h1>
    <div class="sub">GAME.EXE, <span id="fsize"></span> bytes, SHA-256 <span class="mono" id="sha"></span></div>
  </div>
  <div class="sub"><span id="mode"></span> <button id="theme" type="button" aria-label="Toggle colour theme">Theme</button></div>
</header>

<section class="bars" aria-label="Progress summary" id="bars"></section>
<div class="facts" id="facts"></div>

<div class="controls">
  <div class="crumbs" id="crumbs"></div>
  <input type="search" id="q" placeholder="Find address (e.g. 4dae66)" aria-label="Find a function by address">
  <button type="button" id="onlyHit" aria-pressed="false">Matched only</button>
  <button type="button" id="vTree" aria-pressed="true">Treemap</button>
  <button type="button" id="vTable" aria-pressed="false">Table</button>
</div>
<div class="legend">
  <span><i class="l-code"></i>Matched code</span>
  <span><i class="l-data"></i>Matched data</span>
  <span><i class="l-todo"></i>Not done (unreconstructed or still referenced)</span>
  <span><i class="l-hit"></i>Outline: contains matched bytes</span>
  <span id="searchInfo" class="mono"></span>
</div>

<div id="stage"><svg id="svg" role="group" aria-label="Treemap of GAME.EXE by bytes"></svg>
  <div id="tableView"></div></div>
<div id="tip" role="tooltip"></div>

<section class="notes" id="notes"></section>
</div>

<script type="application/json" id="data">/*__DATA__*/null</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const fmt = n => n.toLocaleString("en-US");
const pct = (n,d) => { if(!d) return "n/a"; const p = 100*n/d; return p===0 ? "0%" : p<1 ? p.toFixed(3)+"%" : p.toFixed(2)+"%"; };
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const hex = (n,w) => "0x"+n.toString(16).padStart(w||6,"0");
const T = D.totals;

/* ---------- header, bars, facts ---------- */
$("fsize").textContent = fmt(D.file_size);
$("sha").textContent = D.original_sha256.slice(0,16)+"…";
$("sha").title = D.original_sha256;
$("mode").textContent = D.evidence.mode === "ledger" ? "Source: composer range ledger" : "Source: reviewed match manifests";

function barCard(title, matched, total, cls, note){
  const w = total ? Math.max(matched ? 0.25 : 0, 100*matched/total) : 0;
  return `<div class="bar-card"><h2>${title}</h2><div class="pct">${pct(matched,total)}</div>
    <div class="track" role="img" aria-label="${title}: ${pct(matched,total)} matched"><div class="fill ${matched? cls : 'zero'}" style="width:${w}%"></div></div>
    <div class="n">${fmt(matched)} of ${fmt(total)} bytes${note?` · ${note}`:""}</div></div>`;
}
$("bars").innerHTML =
  barCard("Code", T.matched_code, T.code, "code") +
  barCard("Data", T.matched_data, T.data, "data") +
  barCard("Whole file", T.matched_code+T.matched_data, T.file_bytes, "both");
$("facts").innerHTML =
  `<span><b>${fmt(T.functions_complete)}</b> of ${fmt(T.functions)} indexed functions fully matched</span>` +
  `<span><b>${fmt(D.units.filter(u=>u.matched_code||u.matched_data).length)}</b> of ${fmt(D.units.length)} units touched</span>` +
  `<span>Whole-file rebuild: <b>incomplete</b></span>` +
  (T.unclassified ? `<span><b>${fmt(T.unclassified)}</b> bytes unclassified (partial ledger)</span>` : "") +
  `<span>Evidence re-verified this run: <b>${D.evidence.verification && D.evidence.verification.run ? "yes" : "no"}</b></span>`;

/* ---------- squarified treemap ---------- */
function squarify(items, x, y, w, h){
  // items: [{value,...}] sorted desc; returns items with rect {x,y,w,h}
  const total = items.reduce((s,i)=>s+i.value,0);
  if(!total || w<=0 || h<=0) return items.map(i=>(i.rect={x,y,w:0,h:0},i));
  const scale = w*h/total;
  const nodes = items.map(i=>({i, a:i.value*scale}));
  let rx=x, ry=y, rw=w, rh=h, row=[];
  const worst=(r,side)=>{ const s=r.reduce((t,n)=>t+n.a,0); let mx=0,mn=Infinity;
    for(const n of r){ mx=Math.max(mx,n.a); mn=Math.min(mn,n.a); }
    return Math.max(side*side*mx/(s*s), s*s/(side*side*mn)); };
  const layoutRow=r=>{
    const s=r.reduce((t,n)=>t+n.a,0);
    if(rw>=rh){ const cw=s/rh; let cy=ry; for(const n of r){ const ch=n.a/cw; n.i.rect={x:rx,y:cy,w:cw,h:ch}; cy+=ch; } rx+=cw; rw-=cw; }
    else { const ch=s/rw; let cx=rx; for(const n of r){ const cw=n.a/ch; n.i.rect={x:cx,y:ry,w:cw,h:ch}; cx+=cw; } ry+=ch; rh-=ch; }
  };
  for(const n of nodes){
    const side=Math.min(rw,rh);
    if(row.length && worst(row.concat(n),side) > worst(row,side)){ layoutRow(row); row=[]; }
    row.push(n);
  }
  if(row.length) layoutRow(row);
  return items;
}

/* ---------- state ---------- */
const state = {path:[], only:false, view:"tree", q:""};
const groupById = Object.fromEntries(D.groups.map(g=>[g.id,g]));
const unitById = Object.fromEntries(D.units.map(u=>[u.id,u]));
const svg = $("svg"), tip = $("tip");

function matchedOf(o){ return (o.matched_code||0)+(o.matched_data||0); }
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function trunc(s, px){ const n=Math.floor(px/6.1); return n<3 ? "" : s.length>n ? s.slice(0,n-1)+"…" : s; }

function searchSet(){
  const q = state.q.trim().toLowerCase().replace(/^0x/,"");
  const fns = new Set(), units = new Set();
  if(q.length>=2){
    for(const u of D.units) if(u.functions) for(const f of u.functions)
      if(f[0].toString(16).startsWith(q)){ fns.add(f[0]); units.add(u.id); }
  }
  return {q, fns, units};
}

function tipHtml(title, rows){
  return `<b>${title}</b>` + rows.map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
}
function bindTip(node, html){
  node.addEventListener("mousemove", e=>{
    tip.innerHTML = html; tip.style.display="block";
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX+14, innerWidth-r.width-8)+"px";
    tip.style.top = Math.min(e.clientY+14, innerHeight-r.height-8)+"px";
  });
  node.addEventListener("mouseleave", ()=>{ tip.style.display="none"; });
}
function unitRows(o){
  return [["Size", fmt(o.size)+" B"],
          ["Matched code", fmt(o.matched_code)+" B"],
          ["Matched data", fmt(o.matched_data)+" B"],
          ["Share", pct(matchedOf(o), o.size)]];
}

function drawFill(g, o, x, y, w, h, hits){
  // matched share as a bottom bar; always at least 3px when anything matched
  const m = matchedOf(o);
  if(!m) return;
  const bh = Math.min(h, Math.max(3, h*m/o.size));
  const cw = o.matched_code/m;
  if(o.matched_code) el("rect",{x,y:y+h-bh,width:Math.max(1,w*cw),height:bh,fill:"var(--code)",class:"fillc"},g);
  if(o.matched_data) el("rect",{x:x+w*cw,y:y+h-bh,width:Math.max(1,w*(1-cw)),height:bh,fill:"url(#hatch)",class:"filld"},g);
}

function render(){
  const stage = $("stage");
  const W = Math.max(320, stage.clientWidth);
  const H = Math.max(420, Math.min(760, Math.round(innerHeight*0.62)));
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("height",H);
  svg.innerHTML = "";
  const defs = el("defs",{},svg);
  const pat = el("pattern",{id:"hatch",width:7,height:7,patternUnits:"userSpaceOnUse",patternTransform:"rotate(45)"},defs);
  el("rect",{width:7,height:7,fill:"var(--data)"},pat);
  el("rect",{width:3.5,height:7,fill:"color-mix(in srgb,var(--data) 55%,var(--surface))"},pat);
  const S = searchSet();
  $("searchInfo").textContent = S.q.length>=2 ? `${S.fns.size} match${S.fns.size===1?"":"es"} in ${S.units.size} unit${S.units.size===1?"":"s"}` : "";
  renderCrumbs();
  const pad = 2;
  if(state.path.length===0) drawRoot(W,H,pad,S);
  else if(state.path.length===1) drawGroup(groupById[state.path[0]],W,H,pad,S);
  else drawUnit(unitById[state.path[1]],W,H,pad,S);
}

function tileLabel(g, rect, text, sub){
  const t = trunc(text, rect.w-8);
  if(t && rect.h>16){ const e = el("text",{x:rect.x+4,y:rect.y+12},g); e.textContent=t; }
  if(sub && rect.h>30 && rect.w>60){ const e = el("text",{x:rect.x+4,y:rect.y+24,opacity:.75},g); e.textContent=trunc(sub,rect.w-8); }
}

function unitTile(parent, u, r, S, onClick){
  const g = el("g",{class:"tile",tabindex:0,role:"button","aria-label":`${u.label}, ${fmt(u.size)} bytes, ${pct(matchedOf(u),u.size)} matched`},parent);
  const hit = matchedOf(u)>0;
  el("rect",{class:"base",x:r.x,y:r.y,width:Math.max(0,r.w),height:Math.max(0,r.h),fill:"var(--todo)",
    stroke: S.units.has(u.id) ? "var(--focus)" : hit ? "var(--code)" : "var(--todo-edge)",
    "stroke-width": S.units.has(u.id) ? 2.5 : hit ? 2 : 0.75,
    opacity: state.only && !hit ? 0.25 : 1},g);
  drawFill(g,u,r.x,r.y,r.w,r.h);
  tileLabel(g,r,u.label.replace(/ band$/,""), `${pct(matchedOf(u),u.size)} · ${fmt(u.size)} B`);
  bindTip(g, tipHtml(u.label, unitRows(u).concat(u.function_count? [["Functions", `${u.functions_complete}/${u.function_count} matched`]]:[])));
  g.addEventListener("click", onClick);
  g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onClick(); }});
}

function drawRoot(W,H,pad,S){
  const groups = D.groups.map(g=>({g,value:g.size})).sort((a,b)=>b.value-a.value);
  squarify(groups,0,0,W,H);
  for(const it of groups){
    const r = it.rect, g = it.g;
    const head = (r.h>40 && r.w>70) ? 16 : 0;
    const hg = el("g",{class:"tile",tabindex:0,role:"button","aria-label":`${g.label} group`},svg);
    el("rect",{x:r.x+.5,y:r.y+.5,width:Math.max(0,r.w-1),height:Math.max(0,r.h-1),fill:"none",stroke:"var(--text-3)","stroke-width":1},hg);
    if(head){ const t = el("text",{x:r.x+5,y:r.y+12,class:"gl"},hg); t.textContent = trunc(`${g.label} · ${pct(matchedOf(g),g.size)}`, r.w-10); }
    bindTip(hg, tipHtml(g.label, unitRows(g)));
    const open=()=>{ state.path=[g.id]; render(); };
    hg.addEventListener("click",e=>{ if(e.target.closest(".unit")) return; open(); });
    hg.addEventListener("keydown",e=>{ if(e.key==="Enter"){ open(); }});
    const us = D.units.filter(u=>u.group===g.id).map(u=>({u,value:u.size})).sort((a,b)=>b.value-a.value);
    squarify(us, r.x+pad, r.y+pad+head, r.w-2*pad, r.h-2*pad-head);
    const ug = el("g",{class:"unit"},svg);
    for(const ui of us){
      const rr = ui.rect; rr.x+=.5; rr.y+=.5; rr.w-=1; rr.h-=1;
      unitTile(ug, ui.u, rr, S, ()=>{ state.path=[g.id,ui.u.id]; render(); });
    }
  }
}

function drawGroup(g,W,H,pad,S){
  const us = D.units.filter(u=>u.group===g.id).map(u=>({u,value:u.size})).sort((a,b)=>b.value-a.value);
  squarify(us,0,0,W,H);
  for(const ui of us){ const r=ui.rect; r.x+=.5; r.y+=.5; r.w-=1; r.h-=1;
    unitTile(svg, ui.u, r, S, ()=>{ state.path=[g.id,ui.u.id]; render(); }); }
}

function drawUnit(u,W,H,pad,S){
  if(!u.functions){
    // data piece: one tile
    const r={x:.5,y:.5,w:W-1,h:H-1};
    unitTile(svg,u,r,S,()=>{});
    const t = el("text",{x:12,y:H/2+4,"text-anchor":"start"},svg);
    t.textContent = "No sub-structure is recorded for this data piece yet.";
    return;
  }
  const fs = u.functions.map(f=>({f,value:f[1]})).sort((a,b)=>b.value-a.value);
  squarify(fs,0,0,W,H);
  for(const it of fs){
    const f=it.f, r=it.rect; r.x+=.5; r.y+=.5; r.w-=1; r.h-=1;
    const full = f[2]===f[1], part = f[2]>0 && !full;
    const g = el("g",{class:"tile",tabindex:0,"aria-label":`function ${hex(f[0])}, ${f[1]} bytes, ${f[2]} matched`},svg);
    const hitSearch = S.fns.has(f[0]);
    el("rect",{class:"base",x:r.x,y:r.y,width:Math.max(0,r.w),height:Math.max(0,r.h),
      fill: full ? "var(--code)" : "var(--todo)",
      stroke: hitSearch ? "var(--focus)" : part ? "var(--code)" : "var(--todo-edge)",
      "stroke-width": hitSearch ? 2.5 : part ? 2 : .75,
      opacity: state.only && !f[2] ? 0.25 : 1},g);
    if(part){ const bh=Math.min(r.h,Math.max(3,r.h*f[2]/f[1])); el("rect",{x:r.x,y:r.y+r.h-bh,width:Math.max(0,r.w),height:bh,fill:"var(--code)"},g); }
    if(r.w>56 && r.h>14){ const t=el("text",{x:r.x+4,y:r.y+12,fill:"#fff"},g); t.textContent=trunc(hex(f[0]),r.w-8);
      if(full) t.setAttribute("style","fill:#fff"); }
    bindTip(g, tipHtml(hex(f[0],8), [["Span",fmt(f[1])+" B"],["Matched",fmt(f[2])+" B"],["State", full?"fully matched":part?"partial range":"not done"]]));
  }
}

function renderCrumbs(){
  const c=$("crumbs"); c.innerHTML="";
  const add=(label,path)=>{ const b=document.createElement("button"); b.type="button"; b.textContent=label;
    b.addEventListener("click",()=>{ state.path=path; render(); }); if(c.childNodes.length) c.appendChild(document.createTextNode("›")); c.appendChild(b); };
  add("All", []);
  if(state.path[0]) add(groupById[state.path[0]].label, [state.path[0]]);
  if(state.path[1]) add(unitById[state.path[1]].label, state.path.slice(0,2));
  const last=c.querySelectorAll("button"); last[last.length-1].setAttribute("aria-current","page");
}

/* ---------- table view ---------- */
function renderTable(){
  const rows = D.units.slice().sort((a,b)=> matchedOf(b)-matchedOf(a) || b.size-a.size);
  $("tableView").innerHTML = `<table><thead><tr><th>Unit</th><th>Group</th><th>Bytes</th><th>Matched code</th><th>Matched data</th><th>Share</th><th>Functions matched</th></tr></thead><tbody>` +
    rows.map(u=>`<tr><td>${u.label}</td><td>${groupById[u.group].label}</td><td>${fmt(u.size)}</td><td>${fmt(u.matched_code)}</td><td>${fmt(u.matched_data)}</td><td>${pct(matchedOf(u),u.size)}</td><td>${u.function_count? u.functions_complete+"/"+u.function_count : "–"}</td></tr>`).join("") +
    `</tbody></table>`;
}

function setView(v){
  state.view=v;
  $("svg").style.display = v==="tree" ? "block":"none";
  $("tableView").style.display = v==="table" ? "block":"none";
  $("vTree").setAttribute("aria-pressed", v==="tree");
  $("vTable").setAttribute("aria-pressed", v==="table");
  if(v==="table") renderTable(); else render();
}

/* ---------- notes ---------- */
const ev = D.evidence;
$("notes").innerHTML =
  `<h3>What the colours mean</h3>
   <p>Green is code that reassembles byte-exactly from reviewed reconstructed assembly. Blue (hatched) is data produced by the composer and confirmed by the whole-file hash. Grey is everything else: unreconstructed, or still copied from the local original and therefore reported, never counted, as matched.</p>
   <h3>Units</h3><p>${D.unit_definition} Tile area is bytes.</p>
   <h3>Limits</h3>
   <p>Matched is a byte-exact claim, not a claim of original C++ or compiler provenance. ${ev.mode==="baseline" ? "Baseline code totals are function spans, which also hold jump tables and <code>int 3</code> padding (about 10.9 KB), and no data range has composer evidence yet, so data stays at zero. Both change when the composer ledger is supplied." : "Totals come from the composer ledger, where every byte has a kind and a class. Those classes are the composer's own declaration: this page checks the composed image hash when one is supplied, but cannot tell reconstructed bytes from referenced original bytes by itself."} Whole-file x86 match and native gameplay are both still required for completion.</p>
   <h3>Sources</h3>
   <p class="mono">${ev.sources.map(s=>`${s.path} ${s.sha256.slice(0,12)} (${s.role})`).join("<br>")}</p>
   ${ev.crosscheck? `<p>Cross-check with status.json (${fmt(ev.crosscheck.status_json_unique_matched_bytes)} matched bytes): <b>${ev.crosscheck.agrees?"agrees":"DISAGREES"}</b>.</p>`:""}`;

/* ---------- wiring ---------- */
$("q").addEventListener("input",e=>{ state.q=e.target.value; if(state.view==="tree") render(); });
$("onlyHit").addEventListener("click",e=>{ state.only=!state.only; e.currentTarget.setAttribute("aria-pressed",state.only); if(state.view==="tree") render(); });
$("vTree").addEventListener("click",()=>setView("tree"));
$("vTable").addEventListener("click",()=>setView("table"));
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && state.path.length){ state.path.pop(); render(); }});
$("theme").addEventListener("click",()=>{
  const r=document.documentElement, cur=r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme", cur==="dark"?"light":"dark");
});
let rt; new ResizeObserver(()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(state.view==="tree") render(); },60); }).observe($("stage"));
const params = new URLSearchParams(location.search);
if(params.get("theme")) document.documentElement.setAttribute("data-theme", params.get("theme"));
if(params.get("q")){ state.q=params.get("q"); $("q").value=state.q; }
if(params.get("path")){ state.path=params.get("path").split(",").filter(Boolean); }
if(params.get("view")==="table") setView("table"); else render();
})();
</script>
</body>
</html>
